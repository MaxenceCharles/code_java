<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutoriel Java Interactif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Prism.js Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="iconjava.png">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'Fira Code', monospace !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        [contenteditable="true"]:focus { outline: none; }

        /* Styles forcés pour les listes à puces et numérotées */
        #editTopicDescription ul, #topicDescription ul { list-style-type: disc !important; padding-left: 1.5rem !important; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        #editTopicDescription ol, #topicDescription ol { list-style-type: decimal !important; padding-left: 1.5rem !important; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        #editTopicDescription li, #topicDescription li { display: list-item !important; margin-bottom: 0.25rem; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-200">

    <!-- Navbar Top -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between shrink-0 shadow-lg">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-all bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" title="Afficher/Masquer le menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-white font-bold shadow-md shadow-orange-500/20">
                <i class="fa-brands fa-java text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-orange-400 via-amber-200 to-amber-400 bg-clip-text text-transparent">
                    Apprendre Java
                </h1>
                <p class="text-xs text-slate-400">Guide de référence interactif</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="toggleEditBtn" onclick="toggleEditMode()" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
                <i class="fa-solid fa-pen-to-square text-amber-400"></i>
                <span id="editBtnText">Mode Édition : Désactivé</span>
            </button>

            <!-- Bouton pour pousser uniquement topics.json sur GitHub -->
            <button onclick="pushToGithub()" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-md shadow-emerald-900/30 active:scale-95">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Pousser les cours (JSON)</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-72 bg-slate-900/80 border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300">
            <div class="p-4 border-b border-slate-800/80 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Notions Clés</span>
                    <button id="addTabBtn" onclick="addNewTopic()" class="text-xs bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 px-2.5 py-1 rounded-md border border-amber-500/30 transition-all flex items-center gap-1 hidden">
                        <i class="fa-solid fa-plus"></i> Ajouter
                    </button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
                    <input type="text" id="searchInput" oninput="filterTopics(this.value)" placeholder="Rechercher une notion..." class="w-full bg-slate-950 text-xs text-slate-200 border border-slate-700 rounded-lg pl-8 pr-3 py-2 focus:outline-none focus:border-amber-500 placeholder-slate-500">
                </div>
            </div>
            
            <nav id="topicsList" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1"></nav>
            
            <div class="p-3 border-t border-slate-800 bg-slate-950/40 text-xs text-slate-500 flex items-center justify-between">
                <span>Statut : <span id="statusIndicator" class="text-emerald-400 font-medium">À jour</span></span>
            </div>
        </aside>

        <!-- Main Content View -->
        <main class="flex-1 overflow-y-auto custom-scrollbar p-8 bg-slate-950 flex flex-col">
            <div class="max-w-4xl w-full mx-auto space-y-6 flex-1">
                <div class="space-y-2 border-b border-slate-800 pb-5 flex items-start justify-between">
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 id="topicTitle" class="text-3xl font-extrabold text-slate-100 tracking-tight"></h2>
                            <button id="deleteTopicBtn" onclick="deleteCurrentTopic()" class="text-rose-400 hover:text-rose-300 p-1.5 rounded-lg hover:bg-rose-950/40 transition-colors hidden" title="Supprimer">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <input type="text" id="editTopicTitle" class="text-2xl font-bold bg-slate-900 text-amber-300 border border-slate-700 rounded-lg px-3 py-1 w-full focus:outline-none focus:border-amber-500 mt-1 hidden" oninput="updateCurrentTopicTitle(this.value)">
                    </div>
                    <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
                        Java Core
                    </span>
                </div>

                <!-- Rich Description Card -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl relative group">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-book-open text-amber-400"></i> Explication de la notion
                    </h3>
                    
                    <!-- Barre d'outils complète style traitement de texte -->
                    <div id="richToolbar" class="hidden flex flex-wrap items-center gap-1 mb-3 p-2 bg-slate-950 border border-slate-700 rounded-lg text-slate-300 text-xs">
                        <select onchange="formatText('fontSize', this.value); this.selectedIndex=0;" class="bg-slate-900 text-slate-300 border border-slate-700 rounded px-1.5 py-1 text-xs">
                            <option value="" disabled selected>Taille</option>
                            <option value="1">Très petit</option>
                            <option value="2">Petit</option>
                            <option value="3">Normal</option>
                            <option value="4">Grand</option>
                            <option value="5">Très grand</option>
                        </select>
                        <span class="w-px h-4 bg-slate-700 mx-1"></span>
                        <button onclick="formatText('bold')" class="p-1.5 hover:bg-slate-800 rounded" title="Gras"><i class="fa-solid fa-bold"></i></button>
                        <button onclick="formatText('italic')" class="p-1.5 hover:bg-slate-800 rounded" title="Italique"><i class="fa-solid fa-italic"></i></button>
                        <button onclick="formatText('underline')" class="p-1.5 hover:bg-slate-800 rounded" title="Souligné"><i class="fa-solid fa-underline"></i></button>
                        <button onclick="formatText('strikeThrough')" class="p-1.5 hover:bg-slate-800 rounded" title="Barré"><i class="fa-solid fa-strikethrough"></i></button>
                        <span class="w-px h-4 bg-slate-700 mx-1"></span>
                        <button onclick="formatText('superscript')" class="p-1.5 hover:bg-slate-800 rounded font-mono" title="Exposant">x²</button>
                        <button onclick="formatText('subscript')" class="p-1.5 hover:bg-slate-800 rounded font-mono" title="Indice">x₂</button>
                        <span class="w-px h-4 bg-slate-700 mx-1"></span>
                        <button onclick="formatText('removeFormat')" class="p-1.5 hover:bg-slate-800 rounded text-rose-400" title="Effacer le formatage"><i class="fa-solid fa-text-slash"></i></button>
                        <span class="w-px h-4 bg-slate-700 mx-1"></span>
                        <!-- Couleurs et surlignage -->
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] text-slate-500">Texte:</span>
                            <input type="color" onchange="formatText('foreColor', this.value)" class="w-5 h-5 bg-transparent cursor-pointer rounded border border-slate-700" title="Couleur du texte">
                        </div>
                        <div class="flex items-center gap-1 ml-1">
                            <span class="text-[10px] text-slate-500">Fond:</span>
                            <input type="color" onchange="formatText('backColor', this.value)" class="w-5 h-5 bg-transparent cursor-pointer rounded border border-slate-700" title="Couleur de fond">
                        </div>
                        <span class="w-px h-4 bg-slate-700 mx-1"></span>
                        <!-- Alignements -->
                        <button onclick="formatText('justifyLeft')" class="p-1.5 hover:bg-slate-800 rounded" title="Aligner à gauche"><i class="fa-solid fa-align-left"></i></button>
                        <button onclick="formatText('justifyCenter')" class="p-1.5 hover:bg-slate-800 rounded" title="Centrer"><i class="fa-solid fa-align-center"></i></button>
                        <button onclick="formatText('justifyRight')" class="p-1.5 hover:bg-slate-800 rounded" title="Aligner à droite"><i class="fa-solid fa-align-right"></i></button>
                        <button onclick="formatText('justifyFull')" class="p-1.5 hover:bg-slate-800 rounded" title="Justifier"><i class="fa-solid fa-align-justify"></i></button>
                        <span class="w-px h-4 bg-slate-700 mx-1"></span>
                        <!-- Listes -->
                        <button onclick="formatText('insertUnorderedList')" class="p-1.5 hover:bg-slate-800 rounded" title="Liste à puces"><i class="fa-solid fa-list-ul"></i></button>
                        <button onclick="formatText('insertOrderedList')" class="p-1.5 hover:bg-slate-800 rounded" title="Liste numérotée"><i class="fa-solid fa-list-ol"></i></button>
                    </div>

                    <div id="topicDescription" class="prose prose-invert max-w-none text-slate-300 leading-relaxed space-y-3"></div>
                    <div id="editTopicDescription" contenteditable="false" class="hidden w-full h-40 bg-slate-950 text-slate-200 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-500 font-sans overflow-y-auto custom-scrollbar" oninput="updateCurrentTopicDesc(this.innerHTML)"></div>
                </div>

                <!-- Code Example Card -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div class="bg-slate-800/80 px-4 py-2.5 border-b border-slate-700/60 flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-rose-500/80 inline-block"></span>
                            <span class="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
                            <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
                            <span class="ml-2 text-xs font-mono text-slate-400">Example.java</span>
                        </div>
                        <button onclick="copyCode()" class="text-xs text-slate-400 hover:text-slate-200 flex items-center gap-1 transition-colors bg-slate-700/50 px-2 py-1 rounded">
                            <i class="fa-regular fa-copy"></i> Copier
                        </button>
                    </div>

                    <div id="codeDisplayContainer" class="p-4 bg-slate-950 overflow-x-auto">
                        <pre class="m-0"><code id="topicCode" class="language-java"></code></pre>
                    </div>

                    <div id="codeEditContainer" class="hidden p-4 bg-slate-950">
                        <textarea id="editTopicCode" class="w-full h-64 bg-slate-900 text-emerald-400 font-mono text-sm border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-amber-500" oninput="updateCurrentTopicCode(this.value)"></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        const GITHUB_CONFIG = {
            owner: "MaxenceCharles", 
            repo: "code_java",    
            branch: "main",
            jsonPath: "topics.json" // Seul ce fichier sera poussé lors de la synchro des cours
        };

        let topics = [];
        let currentTopicId = '';
        let isEditMode = false;
        let isSidebarHidden = false;
        let searchQuery = '';

        window.onload = async function() {
            await loadTopics();
            renderSidebar();
            if (topics.length > 0) selectTopic(topics[0].id);

            // Gestion de la touche Tab dans le code Java
            document.getElementById('editTopicCode').addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + 4;
                    updateCurrentTopicCode(this.value);
                }
            });

            // Gestion de la touche Tab dans la zone de description éditable
            document.getElementById('editTopicDescription').addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
                }
            });
        };

        async function loadTopics() {
            try {
                const response = await fetch('topics.json?t=' + Date.now());
                if (response.ok) {
                    topics = await response.json();
                } else {
                    throw new Error("topics.json introuvable");
                }
            } catch (err) {
                console.warn("Chargement distant échoué, utilisation du localStorage", err);
                const savedData = localStorage.getItem('java_tutorial_topics');
                if (savedData) topics = JSON.parse(savedData);
                else topics = [{ id: 'default', title: 'Introduction', description: 'Bienvenue sur votre guide Java.', code: 'public class Main {}' }];
            }
        }

        function saveDataLocally() {
            localStorage.setItem('java_tutorial_topics', JSON.stringify(topics));
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            isSidebarHidden = !isSidebarHidden;
            sidebar.classList.toggle('hidden', isSidebarHidden);
        }

        function filterTopics(query) {
            searchQuery = query.toLowerCase().trim();
            renderSidebar();
        }

        function renderSidebar() {
            const container = document.getElementById('topicsList');
            container.innerHTML = '';

            const filteredTopics = topics.filter(t => {
                if (!searchQuery) return true;
                return t.title.toLowerCase().includes(searchQuery) || t.description.toLowerCase().includes(searchQuery);
            });

            if (filteredTopics.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-500 text-center py-4">Aucune notion trouvée</div>`;
                return;
            }

            filteredTopics.forEach((topic) => {
                const originalIndex = topics.findIndex(t => t.id === topic.id);
                const isActive = topic.id === currentTopicId;
                const div = document.createElement('div');
                div.className = `w-full px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all flex items-center justify-between group ${
                    isActive ? 'bg-amber-500/15 text-amber-300 border border-amber-500/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                }`;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate cursor-pointer flex-1';
                titleSpan.textContent = topic.title;
                titleSpan.onclick = () => selectTopic(topic.id);
                div.appendChild(titleSpan);

                if (isEditMode && !searchQuery) {
                    const controls = document.createElement('div');
                    controls.className = 'flex items-center space-x-1 ml-2';

                    const upBtn = document.createElement('button');
                    upBtn.innerHTML = '<i class="fa-solid fa-arrow-up text-xs"></i>';
                    upBtn.className = `p-1 text-slate-400 hover:text-white transition-colors ${originalIndex === 0 ? 'opacity-30 cursor-not-allowed' : ''}`;
                    upBtn.onclick = (e) => { e.stopPropagation(); moveTopic(originalIndex, -1); };

                    const downBtn = document.createElement('button');
                    downBtn.innerHTML = '<i class="fa-solid fa-arrow-down text-xs"></i>';
                    downBtn.className = `p-1 text-slate-400 hover:text-white transition-colors ${originalIndex === topics.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}`;
                    downBtn.onclick = (e) => { e.stopPropagation(); moveTopic(originalIndex, 1); };

                    controls.appendChild(upBtn);
                    controls.appendChild(downBtn);
                    div.appendChild(controls);
                }
                container.appendChild(div);
            });
        }

        function moveTopic(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= topics.length) return;
            const temp = topics[index];
            topics[index] = topics[newIndex];
            topics[newIndex] = temp;
            saveDataLocally();
            renderSidebar();
        }

        function selectTopic(id) {
            currentTopicId = id;
            const topic = topics.find(t => t.id === id);
            if (!topic) return;
            renderSidebar();

            document.getElementById('topicTitle').textContent = topic.title;
            document.getElementById('editTopicTitle').value = topic.title;
            document.getElementById('topicDescription').innerHTML = topic.description;
            document.getElementById('editTopicDescription').innerHTML = topic.description;
            document.getElementById('topicCode').textContent = topic.code;
            document.getElementById('editTopicCode').value = topic.code;
            Prism.highlightElement(document.getElementById('topicCode'));
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.getElementById('editBtnText').textContent = isEditMode ? "Mode Édition : Activé" : "Mode Édition : Désactivé";
            document.getElementById('toggleEditBtn').className = isEditMode ? 
                document.getElementById('toggleEditBtn').className.replace('bg-slate-800 text-slate-300', 'bg-amber-500 text-slate-950 font-bold') :
                document.getElementById('toggleEditBtn').className.replace('bg-amber-500 text-slate-950 font-bold', 'bg-slate-800 text-slate-300');

            document.getElementById('addTabBtn').classList.toggle('hidden', !isEditMode);
            document.getElementById('deleteTopicBtn').classList.toggle('hidden', !isEditMode);
            document.getElementById('richToolbar').classList.toggle('hidden', !isEditMode);
            document.getElementById('topicTitle').classList.toggle('hidden', isEditMode);
            document.getElementById('editTopicTitle').classList.toggle('hidden', !isEditMode);
            document.getElementById('topicDescription').classList.toggle('hidden', isEditMode);
            document.getElementById('editTopicDescription').classList.toggle('hidden', !isEditMode);
            document.getElementById('editTopicDescription').setAttribute('contenteditable', isEditMode);
            document.getElementById('codeDisplayContainer').classList.toggle('hidden', isEditMode);
            document.getElementById('codeEditContainer').classList.toggle('hidden', !isEditMode);

            if (!isEditMode) selectTopic(currentTopicId);
            renderSidebar();
        }

        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            updateCurrentTopicDesc(document.getElementById('editTopicDescription').innerHTML);
        }

        function updateCurrentTopicTitle(val) {
            const topic = topics.find(t => t.id === currentTopicId);
            if (topic) { topic.title = val; document.getElementById('topicTitle').textContent = val; renderSidebar(); saveDataLocally(); }
        }

        function updateCurrentTopicDesc(val) {
            const topic = topics.find(t => t.id === currentTopicId);
            if (topic) { topic.description = val; document.getElementById('topicDescription').innerHTML = val; saveDataLocally(); }
        }

        function updateCurrentTopicCode(val) {
            const topic = topics.find(t => t.id === currentTopicId);
            if (topic) { topic.code = val; document.getElementById('topicCode').textContent = val; Prism.highlightElement(document.getElementById('topicCode')); saveDataLocally(); }
        }

        function addNewTopic() {
            const newId = 'topic-' + Date.now();
            topics.push({ id: newId, title: 'Nouvelle Notion', description: 'Expliquez votre notion...', code: 'public class Main {}' });
            saveDataLocally();
            selectTopic(newId);
            showToast('Notion ajoutée', 'success');
        }

        function deleteCurrentTopic() {
            if (topics.length <= 1) { showToast('Dernière notion impossible à supprimer', 'warning'); return; }
            topics = topics.filter(t => t.id !== currentTopicId);
            saveDataLocally();
            selectTopic(topics[0].id);
            showToast('Notion supprimée', 'success');
        }

        // PUSH UNIQUE DE topics.json SUR GITHUB
        async function pushToGithub() {
            let token = localStorage.getItem('gh_pat_token');
            if (!token) {
                token = prompt("Entrez votre Token GitHub (Fine-grained token avec 'Contents: Read and write') :");
                if (!token) return;
                localStorage.setItem('gh_pat_token', token.trim());
            }

            showToast('Envoi de topics.json sur GitHub...', 'info');

            try {
                const wasEditing = isEditMode;
                if (wasEditing) toggleEditMode();

                const contentJson = JSON.stringify(topics, null, 4);
                const path = GITHUB_CONFIG.jsonPath;

                const getUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}?ref=${GITHUB_CONFIG.branch}`;
                let sha = null;

                const getRes = await fetch(getUrl, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' } });
                if (getRes.status === 401 || getRes.status === 403) {
                    localStorage.removeItem('gh_pat_token');
                    throw new Error("Token invalide ou permissions insuffisantes.");
                }
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }

                const utf8Bytes = new TextEncoder().encode(contentJson);
                let binaryStr = "";
                for (let i = 0; i < utf8Bytes.length; i++) binaryStr += String.fromCharCode(utf8Bytes[i]);
                
                const putRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({
                        message: `Mise à jour des cours (topics.json) [${new Date().toLocaleString()}]`,
                        content: btoa(binaryStr),
                        branch: GITHUB_CONFIG.branch,
                        ...(sha ? { sha } : {})
                    })
                });

                if (!putRes.ok) {
                    const errData = await putRes.json();
                    throw new Error(errData.message || 'Erreur lors du push GitHub');
                }

                showToast('Succès ! Les cours ont été mis à jour sur GitHub.', 'success');
                if (wasEditing) toggleEditMode();
            } catch (err) {
                console.error(err);
                showToast('Erreur : ' + err.message, 'error');
            }
        }

        function copyCode() {
            const topic = topics.find(t => t.id === currentTopicId);
            if (topic) {
                navigator.clipboard.writeText(topic.code);
                showToast('Code copié !', 'success');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bg = 'bg-slate-800 border-slate-700 text-slate-200', icon = 'fa-circle-info text-sky-400';
            if (type === 'success') { bg = 'bg-slate-900 border-emerald-500/40 text-emerald-200'; icon = 'fa-circle-check text-emerald-400'; }
            if (type === 'warning') { bg = 'bg-slate-900 border-amber-500/40 text-amber-200'; icon = 'fa-triangle-exclamation text-amber-400'; }
            if (type === 'error') { bg = 'bg-slate-900 border-rose-500/40 text-rose-200'; icon = 'fa-circle-xmark text-rose-400'; }

            toast.className = `pointer-events-auto px-4 py-3 rounded-xl border ${bg} shadow-xl text-xs font-medium flex items-center space-x-2 transition-all transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        }
    </script>
</body>
</html>
